<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Interna - Practica 11</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Courier New', monospace;
            background: #0d1117;
            color: #58a6ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            border: 1px solid #30363d;
            padding: 2rem 3rem;
            border-radius: 8px;
            text-align: center;
            background: #161b22;
        }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; color: #3fb950; }
        p  { color: #8b949e; margin: 0.4rem 0; }
        .badge {
            display: inline-block;
            background: #1f6feb;
            color: #fff;
            font-size: 0.75rem;
            padding: 2px 10px;
            border-radius: 20px;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Servidor de Aplicación Interno</h1>
        <p>Este contenedor <strong>no tiene puertos expuestos al host</strong>.</p>
        <p>Solo es accesible a través del balanceador <strong>Nginx</strong>.</p>
        <p>Practica 11 · Administración de Sistemas</p>
        <span class="badge">red_datos aislada</span>
    </div>
</body>
</html>
