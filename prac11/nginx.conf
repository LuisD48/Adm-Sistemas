# =============================================================
# nginx.conf - Balanceador de carga + Hardening de cabeceras
# =============================================================

# Ocultar versión del servidor (hardening)
server_tokens off;

# Definición del grupo de servidores de aplicación (upstream)
upstream app_backend {
    server app_interno:80;
}

server {
    listen 80;
    server_name _;

    # --- Cabeceras de seguridad (hardening perimetral) ---
    add_header X-Frame-Options "SAMEORIGIN"       always;
    add_header X-Content-Type-Options "nosniff"   always;
    add_header X-XSS-Protection "1; mode=block"   always;
    add_header Referrer-Policy "no-referrer"       always;
    # Eliminar cabecera que delata tecnología backend
    proxy_hide_header X-Powered-By;

    # --- Proxy hacia el servicio de aplicación interno ---
    location / {
        proxy_pass         http://app_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- Página de error personalizada ---
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}